---
- name: Update apt cache and apply safe upgrades
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 600

- name: Install base packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades, curl, ca-certificates]
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure admin user exists (created by cloud-init; idempotent check)
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash

# SSH hardening. File is named 00- because sshd uses the FIRST value it sees,
# and cloud-init ships 50-cloud-init.conf with PasswordAuthentication yes.
- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Validate sshd config before any restart
  ansible.builtin.command: sshd -t
  changed_when: false

# Firewall (UFW). SSH rule is added BEFORE enabling to avoid lock-out.
- name: UFW allow + rate-limit SSH
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: UFW allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: UFW enable
  community.general.ufw:
    state: enabled

# Brute-force protection
- name: fail2ban jail for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/pkhosting.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 4
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# Automatic security updates
- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Unattended-upgrades local overrides
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52pkhosting-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Ensure apt timers are active
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
