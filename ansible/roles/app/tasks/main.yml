---
- name: Install Python runtime for the app
  ansible.builtin.apt:
    name: [python3-flask, gunicorn]
    state: present

- name: Create unprivileged app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: App directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: "0750"

- name: Deploy app code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/app.py"
    dest: "{{ app_dir }}/app.py"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart pkapp

- name: systemd unit for app
  ansible.builtin.template:
    src: pkapp.service.j2
    dest: /etc/systemd/system/pkapp.service
    mode: "0644"
  notify: Restart pkapp

- name: Enable and start app
  ansible.builtin.systemd:
    name: pkapp
    enabled: true
    state: started
    daemon_reload: true
